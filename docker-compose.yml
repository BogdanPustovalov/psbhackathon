services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
